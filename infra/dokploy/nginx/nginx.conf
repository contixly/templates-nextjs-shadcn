user nginx;
worker_processes 1;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format edge '$remote_addr - $host "$request" $status $body_bytes_sent '
                    'cache=$edge_cache_status upstream=$upstream_addr '
                    'request_time=$request_time upstream_time=$upstream_response_time';

    access_log /var/log/nginx/access.log edge;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff2;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    proxy_cache_path /var/cache/nginx/public
        levels=1:2
        keys_zone=public_pages:16m
        max_size=512m
        inactive=24h
        use_temp_path=off;

    map $request_method $skip_method {
        default 1;
        GET 0;
        HEAD 0;
    }

    map $http_authorization $skip_authorization {
        default 1;
        "" 0;
    }

    map $http_rsc $skip_rsc {
        default 1;
        "" 0;
    }

    map $http_next_router_state_tree $skip_router_state {
        default 1;
        "" 0;
    }

    map $http_next_router_prefetch $skip_router_prefetch {
        default 1;
        "" 0;
    }

    map $http_next_router_segment_prefetch $skip_router_segment_prefetch {
        default 1;
        "" 0;
    }

    map $http_next_action $skip_next_action {
        default 1;
        "" 0;
    }

    map "$http_purpose|$http_sec_purpose" $skip_prefetch {
        default 0;
        ~*prefetch 1;
    }

    map $uri $skip_next_data_path {
        default 0;
        ~*\.segment\.rsc$ 1;
        ~*\.rsc$ 1;
    }

    map $uri $skip_generated_docs_image {
        default 0;
        ~*^/docs/og/ 1;
        ~*^/docs/(?:[^/]+/)*(?:opengraph-image|twitter-image|icon|apple-icon)(?:[./]|$) 1;
    }

    map "$skip_method$skip_authorization$skip_rsc$skip_router_state$skip_router_prefetch$skip_router_segment_prefetch$skip_next_action$skip_prefetch$skip_next_data_path$skip_generated_docs_image" $skip_request_cache {
        default 1;
        "0000000000" 0;
    }

    map $args $skip_document_query {
        default 1;
        "" 0;
    }

    map "$skip_request_cache$skip_document_query" $skip_document_cache {
        default 1;
        "00" 0;
    }

    map "$upstream_http_cache_control|$upstream_http_vary" $skip_private_response {
        default 0;
        ~*(private|no-cache|no-store) 1;
        ~*\|\s*\* 1;
    }

    map $upstream_http_set_cookie $upstream_sets_cookie {
        default 1;
        "" 0;
    }

    map "$upstream_cache_status:$upstream_status:$skip_private_response:$upstream_sets_cookie" $public_document_cache_control {
        default "private, no-store";
        ~^(HIT|REVALIDATED): "public, max-age=0, s-maxage=3600";
        ~^(MISS|EXPIRED):200:0:0$ "public, max-age=0, s-maxage=3600";
    }

    map $upstream_cache_status $edge_cache_status {
        default $upstream_cache_status;
        "" BYPASS;
    }

    map $http_x_forwarded_host $forwarded_host {
        default $http_x_forwarded_host;
        "" $host;
    }

    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        "" $scheme;
    }

    map $http_x_forwarded_port $forwarded_port {
        default $http_x_forwarded_port;
        "" $server_port;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" "";
    }

    server {
        listen 8080;
        server_name _;

        set $web_upstream "http://web:3000";

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            add_header Cache-Control "no-store" always;
            return 200 "ok\n";
        }

        location ^~ /docs/og/ {
            proxy_pass $web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $forwarded_host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Port $forwarded_port;
            proxy_set_header Accept-Encoding "";
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;

            proxy_no_cache 1;
            add_header X-Edge-Cache BYPASS always;
            add_header X-Edge-Replica $hostname always;
        }

        location = /docs/opengraph-image {
            proxy_pass $web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $forwarded_host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Port $forwarded_port;
            proxy_set_header Accept-Encoding "";
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;

            proxy_no_cache 1;
            add_header X-Edge-Cache BYPASS always;
            add_header X-Edge-Replica $hostname always;
        }

        location = /docs/twitter-image {
            proxy_pass $web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $forwarded_host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Port $forwarded_port;
            proxy_set_header Accept-Encoding "";
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;

            proxy_no_cache 1;
            add_header X-Edge-Cache BYPASS always;
            add_header X-Edge-Replica $hostname always;
        }

        location = /docs {
            proxy_pass $web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $forwarded_host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Port $forwarded_port;
            proxy_set_header Accept-Encoding "";
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;

            proxy_cache public_pages;
            proxy_cache_key "$forwarded_proto|$host|$uri";
            proxy_cache_methods GET HEAD;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 10s;
            proxy_cache_lock_age 10s;
            proxy_cache_valid 200 60m;
            proxy_cache_bypass $skip_document_cache;
            proxy_no_cache $skip_document_cache;
            proxy_no_cache $skip_private_response;
            proxy_no_cache $upstream_http_set_cookie;
            proxy_ignore_headers Cache-Control Expires X-Accel-Buffering;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;

            add_header Cache-Control $public_document_cache_control always;
            add_header X-Edge-Cache $edge_cache_status always;
            add_header X-Edge-Replica $hostname always;
        }

        location ~ ^/docs/(.+)$ {
            proxy_pass $web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $forwarded_host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Port $forwarded_port;
            proxy_set_header Accept-Encoding "";
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;

            proxy_cache public_pages;
            proxy_cache_key "$forwarded_proto|$host|$uri";
            proxy_cache_methods GET HEAD;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 10s;
            proxy_cache_lock_age 10s;
            proxy_cache_valid 200 60m;
            proxy_cache_bypass $skip_document_cache;
            proxy_no_cache $skip_document_cache;
            proxy_no_cache $skip_private_response;
            proxy_no_cache $upstream_http_set_cookie;
            proxy_ignore_headers Cache-Control Expires X-Accel-Buffering;
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;

            add_header Cache-Control $public_document_cache_control always;
            add_header X-Edge-Cache $edge_cache_status always;
            add_header X-Edge-Replica $hostname always;
        }

        location ^~ /_next/static/ {
            proxy_pass $web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $forwarded_host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Port $forwarded_port;
            proxy_set_header Accept-Encoding "";
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;

            proxy_cache public_pages;
            proxy_cache_key "$forwarded_proto|$host|$uri";
            proxy_cache_methods GET HEAD;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 10s;
            proxy_cache_lock_age 10s;
            proxy_cache_valid 200 365d;
            proxy_cache_bypass $skip_request_cache;
            proxy_no_cache $skip_request_cache;
            proxy_no_cache $skip_private_response;
            proxy_no_cache $upstream_http_set_cookie;
            proxy_ignore_headers X-Accel-Buffering;

            add_header X-Edge-Cache $edge_cache_status always;
            add_header X-Edge-Replica $hostname always;
        }

        location / {
            proxy_pass $web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $forwarded_host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Port $forwarded_port;
            proxy_set_header Accept-Encoding "";
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;

            proxy_no_cache 1;
            add_header X-Edge-Cache BYPASS always;
            add_header X-Edge-Replica $hostname always;
        }
    }
}
